  <!--
    GitHub Pages SPA redirect restore.
    When a deep link (e.g. /investment-account-documentation/restguide) is
    requested directly, GitHub Pages serves 404.html, which encodes the path
    into a query string and redirects to index.html. This snippet decodes that
    query string back into the real URL (using history.replaceState) BEFORE the
    Angular router reads location, so the router matches the correct route
    instead of falling through to the wildcard not-found route.
    Based on the spa-github-pages technique (https://github.com/rafgraph/spa-github-pages).
  -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
